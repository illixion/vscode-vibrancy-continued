name: 🌐 Translation
description: Offer a translation, or fix one that reads wrong
title: "[Translation]: "
labels: ["translation"]
body:
- type: markdown
  attributes:
    value: |
      Thank you for helping! The easiest way is the translation editor built into Vibrancy: run **Translate Vibrancy** from the Command Palette, and its **Send to Vibrancy** button opens this form with your file copied, ready to paste or attach below. Details are in [docs/TRANSLATING.md](https://github.com/illixion/vscode-vibrancy-continued/blob/main/docs/TRANSLATING.md).
- type: input
  attributes:
    label: Language and locale code
    description: The language, the region if it matters, and the code VS Code uses for it.
    placeholder: "Traditional Chinese (Taiwan), zh-tw"
  validations:
    required: true
- type: dropdown
  attributes:
    label: What are you offering?
    options:
    - A new language
    - A correction to an existing translation
  validations:
    required: true
- type: textarea
  attributes:
    label: Details
    description: Paste or attach your `package.nls.<locale>.json` here if you are not opening a pull request. For a correction, say which strings and what they should say.
  validations:
    required: false
